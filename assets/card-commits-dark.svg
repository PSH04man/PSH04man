<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .big { font-size: 46px; font-weight: 800; fill: #E6EDF3; }
    .of { font-size: 20px; font-weight: 600; fill: #8B949E; }
    .s { font-size: 13.5px; font-weight: 500; fill: #B1BAC4; }
    .m { font-size: 12px; font-weight: 600; fill: #8B949E; }
    .p { font-size: 14px; font-weight: 800; fill: #E6EDF3; }
  </style>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#CDE4F5"/><stop offset="1" stop-color="#F0DBA8"/></linearGradient></defs>
  <rect x="1" y="1" width="418" height="208" rx="14" fill="#161B22" stroke="#30363D"/>
  <rect x="1" y="1" width="418" height="6" rx="3" fill="url(#g)"/>
  <text x="24" y="44" class="t m">📊 CONTRIBUTION · 끄덕</text>
  <text x="24" y="100" class="t big">161<tspan class="of" dx="6">/ 241 commits</tspan></text>
  <text x="24" y="128" class="t s">3인 팀 중 최다 기여</text>
  <rect x="24" y="150" width="320" height="14" rx="7" fill="#21262D"/>
  <rect x="24" y="150" width="0" height="14" rx="7" fill="url(#g)">
    <animate attributeName="width" from="0" to="214" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="356" y="162" class="t p">67%</text>
  <text x="24" y="190" class="t m">아동 학습 화면 · 마이페이지 UI · UX · 성능</text>
</svg>
