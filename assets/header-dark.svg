<svg xmlns="http://www.w3.org/2000/svg" width="854" height="220" viewBox="0 0 854 220">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .name { font-size: 46px; font-weight: 800; fill: #E6EDF3; }
    .role { font-size: 17px; font-weight: 600; fill: #B1BAC4; letter-spacing: 1px; }
    .tag  { font-size: 14px; font-weight: 500; fill: #8B949E; }
    .name, .role, .tag { opacity: 0; animation: up .9s ease-out forwards; }
    .role { animation-delay: .25s; } .tag { animation-delay: .5s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F4E79"/><stop offset="100%" stop-color="#7A5C1E"/>
    </linearGradient>
  </defs>
  <path fill="url(#g)" opacity="0.45">
    <animate attributeName="d" dur="18s" repeatCount="indefinite"
      values="M0 0H854V60Q640 95 427 70T0 85Z;M0 0H854V80Q640 55 427 85T0 60Z;M0 0H854V60Q640 95 427 70T0 85Z"/>
  </path>
  <path fill="url(#g)" opacity="0.3">
    <animate attributeName="d" dur="18s" begin="-9s" repeatCount="indefinite"
      values="M0 0H854V75Q640 50 427 80T0 70Z;M0 0H854V55Q640 90 427 60T0 90Z;M0 0H854V75Q640 50 427 80T0 70Z"/>
  </path>
  <text x="427" y="140" text-anchor="middle" class="t name">박성현</text>
  <text x="427" y="172" text-anchor="middle" class="t role">FRONTEND · AI SERVICE · PROBLEM SOLVING</text>
  <text x="427" y="198" text-anchor="middle" class="t tag">AI 서비스를 사용자가 만나는 화면부터 만드는 개발자</text>
</svg>
